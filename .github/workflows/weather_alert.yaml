name: Teams Weather Bot 24-7 Listener (TTC & FPT Software)

on:
  # Automatically restart the listener with new code whenever you push to main!
  push:
    branches: [ main ]
  # Backup cron every 2 hours to auto-recover if a runner ever crashes
  schedule:
    - cron: '0 */2 * * *'
  # Allow starting manually anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: "listen" (watch chat for ~6h) or "force" (send immediate update)'
        required: false
        default: 'listen'

permissions:
  actions: write
  contents: read

concurrency:
  group: teams-weather-bot-listener
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore seen photos history (prevent duplicates across runs)
        uses: actions/cache/restore@v4
        with:
          path: .seen_vitamin_photos.txt
          key: seen-photos-${{ github.run_id }}
          restore-keys: |
            seen-photos-

      - name: Run Weather Bot (Replies to @Weather Bot + Commute Rain Alerts)
        env:
          PYTHONUNBUFFERED: "1"
          TEAMS_SESSION_B64: ${{ secrets.TEAMS_SESSION_B64 }}
          TEAMS_CHAT_NAME: ${{ secrets.TEAMS_CHAT_NAME }}
          TEAMS_BOT_NAME: ${{ vars.TEAMS_BOT_NAME || 'Weather Bot' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "force" ]; then
            python3 teams_web_sender.py --force
          else
            python3 teams_web_sender.py --listen --max-minutes 345
          fi

      - name: Save seen photos history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .seen_vitamin_photos.txt
          key: seen-photos-${{ github.run_id }}

      - name: Auto-restart next 6h listener session (24/7 continuous loop)
        if: always() && !cancelled() && github.event.inputs.mode != 'force'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering next 6-hour listener run automatically..."
          gh workflow run weather_alert.yml --ref ${{ github.ref_name }}
 